<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cine</title>
  <style>
    :root {
      --bg1: #0f1724;
      --bg2: #24132f;
      --card: rgba(255,255,255,0.06);
      --accent: #ff6b9a;
      --accent-2: #7be0ff;
      --text: #e6edf3;
      --muted: #b7c2cb;
      --gold: #ffd166;
    }

    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--text);
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      margin-bottom: 10px;
    }

    .stars span {
      font-size: 24px;
      cursor: pointer;
      color: rgba(255,255,255,0.2);
    }

    .stars span.active {
      color: var(--gold);
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score {
      font-weight: bold;
      color: var(--accent-2);
    }

    .btn {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--accent-2);
    }

    .hidden {
      display: none;
    }

    .history {
      font-size: 14px;
      color: var(--muted);
    }

    .presentation-mode .card input,
    .presentation-mode .card textarea,
    .presentation-mode .card select,
    .presentation-mode .btn {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">
    <h1>Cine: Reseña y Comparación</h1>

    <div class="card">
      <label for="movie">Título de la película</label>
      <input id="movie" type="text" placeholder="Escribe el título..." />

      <label for="genre">Género</label>
      <select id="genre">
        <option value="">Selecciona género</option>
        <option value="Acción">Acción</option>
        <option value="Comedia">Comedia</option>
        <option value="Drama">Drama</option>
        <option value="Suspenso">Suspenso</option>
        <option value="Animación">Animación</option>
      </select>
    </div>

    <div class="card">
      <label>Publicidad W</label>
      <textarea id="commentW" placeholder="Comentario de Wilmer..."></textarea>
      <div class="rating" id="ratingW">
        <div class="stars">
          <span data-value="1">★</span>
          <span data-value="2">★</span>
          <span data-value="3">★</span>
          <span data-value="4">★</span>
          <span data-value="5">★</span>
        </div>
        <div class="score">0.0 / 5</div>
      </div>
    </div>

    <div class="card">
      <label>Publicidad M</label>
      <textarea id="commentM" placeholder="Comentario de M..."></textarea>
      <div class="rating" id="ratingM">
        <div class="stars">
          <span data-value="1">★</span>
          <span data-value="2">★</span>
          <span data-value="3">★</span>
          <span data-value="4">★</span>
          <span data-value="5">★</span>
        </div>
        <div class="score">0.0 / 5</div>
      </div>
    </div>

    <div class="card">
      <label>📊 Conclusión conjunta</label>
      <textarea id="conclusion" placeholder="Escriban su conclusión..."></textarea>
      <div id="averageScore" class="score">Promedio: 0.0</div>
    </div>

    <button class="btn" onclick="saveReview()">Guardar reseña</button>
    <button class="btn" onclick="togglePresentation()">Modo presentación</button>

    <div class="card history">
      <h3>📜 Historial de reseñas</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    function setupRating(id) {
      const container = document.getElementById(id);
      const stars = container.querySelectorAll('.stars span');
      const score = container.querySelector('.score');

      stars.forEach(star => {
        star.addEventListener('click', () => {
          const val = parseInt(star.getAttribute('data-value'));
          stars.forEach((s, i) => {
            s.classList.toggle('active', i < val);
          });
          score.textContent = val.toFixed(1) + ' / 5';
          updateAverage();
        });
      });
    }

    function getRating(id) {
      const stars = document.getElementById(id).querySelectorAll('.stars span');
      let active = 0;
      stars.forEach(s => { if (s.classList.contains('active')) active++; });
      return active;
    }

    function updateAverage() {
      const r1 = getRating('ratingW');
      const r2 = getRating('ratingM');
      const avg = ((r1 + r2) / 2).toFixed(1);
      document.getElementById('averageScore').textContent = 'Promedio: ' + avg;
    }

    function saveReview() {
      const title = document.getElementById('movie').value;
      const genre = document.getElementById('genre').value;
      const commentW = document.getElementById('commentW').value;
      const commentM = document.getElementById('commentM').value;
      const conclusion = document.getElementById('conclusion').value;
      const scoreW = getRating('ratingW');
      const scoreM = getRating('ratingM');
      const avg = ((scoreW + scoreM) / 2).toFixed(1);

      const review = {
        title, genre, scoreW, scoreM, avg, commentW, commentM, conclusion
      };

      const history = JSON.parse(localStorage.getItem('cineReviews') || '[]');
      history.unshift(review);
      localStorage.setItem('cineReviews', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('cineReviews') || '[]');
      const container = document.getElementById('historyList');
      container.innerHTML = history.map(r => `
        <div style="margin-bottom:12px;">
          <strong>${r.title}</strong> (${r.genre})<br/>
          Wilmer: ${r.scoreW} ★ — M: ${r.scoreM} ★ — Promedio: ${r.avg}<br/>
          <em>Conclusión:</em> ${r.conclusion}
        </div>
      `).join('');
    }

    function togglePresentation() {
      document.getElementById('mainContainer').classList.toggle('presentation-mode');
    }

    setupRating('ratingW');
    setupRating('ratingM');
    renderHistory();
  </script>
</body>
</html>
