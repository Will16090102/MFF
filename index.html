<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cine en Pareja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdf6f0;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h2 {
      color: #c94f7c;
    }
    .section {
      margin-bottom: 30px;
      padding: 15px;
      border: 2px solid #e0c4d3;
      border-radius: 10px;
      background: #fff;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-top: 8px;
    }
    textarea {
      width: 100%;
      height: 60px;
      margin-top: 10px;
      box-sizing: border-box;
      padding: 8px;
    }
    .rating {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }
    .stars span {
      font-size: 30px;
      cursor: pointer;
      color: lightgray;
      user-select: none;
      margin-right: 4px;
    }
    .stars span.active {
      color: gold;
    }
    .score {
      margin-left: 15px;
      font-weight: bold;
      font-size: 18px;
    }
    video, canvas {
      display: block;
      margin-top: 10px;
      border: 1px solid #ccc;
      max-width: 100%;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #c94f7c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #a63c63;
    }
    .note {
      color: #666;
      font-size: 0.9rem;
      margin-top: 6px;
    }
    .error {
      color: #b00020;
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🎬 Cine en Pareja</h2>

  <div class="section">
    <label for="movie">Nombre de la película:</label>
    <input type="text" id="movie" placeholder="Escribe el título...">
  </div>

  <div class="section">
    <h3>Publicidad W ⭐</h3>
    <textarea id="commentW" placeholder="Comentario de Wilmer..."></textarea>
    <div class="rating" id="ratingW">
      <div class="stars" role="radiogroup" aria-label="Puntuación Wilmer">
        <span data-value="1" role="radio" aria-checked="false">★</span>
        <span data-value="2" role="radio" aria-checked="false">★</span>
        <span data-value="3" role="radio" aria-checked="false">★</span>
        <span data-value="4" role="radio" aria-checked="false">★</span>
        <span data-value="5" role="radio" aria-checked="false">★</span>
      </div>
      <div class="score">0.0 / 5</div>
    </div>
  </div>

  <div class="section">
    <h3>Publicidad M ⭐</h3>
    <textarea id="commentM" placeholder="Comentario de M..."></textarea>
    <div class="rating" id="ratingM">
      <div class="stars" role="radiogroup" aria-label="Puntuación M">
        <span data-value="1" role="radio" aria-checked="false">★</span>
        <span data-value="2" role="radio" aria-checked="false">★</span>
        <span data-value="3" role="radio" aria-checked="false">★</span>
        <span data-value="4" role="radio" aria-checked="false">★</span>
        <span data-value="5" role="radio" aria-checked="false">★</span>
      </div>
      <div class="score">0.0 / 5</div>
    </div>
  </div>

  <div class="section">
    <h3>📊 Comparación y Conclusión</h3>
    <textarea id="conclusion" placeholder="Escriban su conclusión conjunta..."></textarea>
  </div>

  <div class="section">
    <h3>📸 Foto del momento</h3>
    <video id="video" width="320" height="240" autoplay playsinline muted></video>
    <button id="snap">Tomar foto</button>
    <canvas id="canvas" width="320" height="240"></canvas>
    <div class="note">Nota: Para usar la cámara necesitas abrir este archivo desde un servidor local (http://localhost) o servirlo vía HTTPS. No funcionará la cámara desde file://</div>
    <div id="cameraError" class="error" aria-live="polite"></div>
  </div>

  <script>
    // Función para activar estrellas
    function setupRating(sectionId) {
      const section = document.getElementById(sectionId);
      const stars = section.querySelectorAll('.stars span');
      const score = section.querySelector('.score');

      stars.forEach((star, index) => {
        star.addEventListener('click', () => {
          const val = parseInt(star.getAttribute('data-value'), 10);
          stars.forEach((s, i) => {
            if (i < val) {
              s.classList.add('active');
              s.setAttribute('aria-checked', 'true');
            } else {
              s.classList.remove('active');
              s.setAttribute('aria-checked', 'false');
            }
          });
          score.textContent = val.toFixed(1) + ' / 5';
        });

        // Permitir selección por teclado (Enter / Space)
        star.setAttribute('tabindex', '0');
        star.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            star.click();
          }
        });
      });
    }

    setupRating('ratingW');
    setupRating('ratingM');

    // Activar cámara
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snap = document.getElementById('snap');
    const context = canvas.getContext('2d');
    const cameraError = document.getElementById('cameraError');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          video.play().catch(() => {});
        })
        .catch(err => {
          console.error('Error al acceder a la cámara:', err);
          cameraError.textContent = 'No se pudo acceder a la cámara. Comprueba permisos o usa HTTPS / localhost.';
        });
    } else {
      cameraError.textContent = 'getUserMedia no soportado por este navegador.';
    }

    snap.addEventListener('click', () => {
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
    });
  </script>

</body>
</html>
